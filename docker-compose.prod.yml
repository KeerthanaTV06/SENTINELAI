version: '3.8'

services:
  # ---------------------------------------------------------
  # BYPASSING KAFKA & ZOOKEEPER FOR LOCAL/STANDALONE RUN
  # ---------------------------------------------------------
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.3.2
  #   ...
  # kafka:
  #   image: confluentinc/cp-kafka:7.3.2
  #   ...
  # ---------------------------------------------------------

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9200:9200
    networks:
      - sentinel-net

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.13
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
    networks:
      - sentinel-net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    ports:
      - 8000:8000
    volumes:
      - ./logs:/home/sentinel/app/logs
      - ./models:/home/sentinel/app/models
    depends_on:
      - elasticsearch
    networks:
      - sentinel-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    env_file: .env
    ports:
      - 8080:80
    depends_on:
      - backend
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge
